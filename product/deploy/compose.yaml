services:
  product:
    build:
      context: ../..
      dockerfile: product/deploy/Dockerfile
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      PRODUCT_TEST_BILLING: "false"
      PRODUCT_INTERNAL_RESEARCH: "false"
      PRODUCT_PUBLIC_HISTORY: "${PRODUCT_PUBLIC_HISTORY:-disabled}"
      PRODUCT_CORS_ORIGINS: "${PRODUCT_CORS_ORIGINS:-}"
    volumes:
      - product-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  product-data:
